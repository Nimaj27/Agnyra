<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Seed one-off — organisations ezy / saint-andre</title>
</head>
<body>
  <h1>Seed one-off — nouvelles casernes</h1>
  <p>
    Script temporaire (onboarding de casernes par anticipation).
    <strong>À supprimer une fois les documents créés et vérifiés.</strong>
  </p>
  <button id="btn-login">1. Se connecter (compte admin)</button>
  <button id="btn-seed" disabled>2. Créer les organisations</button>
  <pre id="log"></pre>

  <script type="module">
    import { loginGoogle, onAuth, isAdmin, creerOrganisation, obtenirOrganisation }
      from "../js/firebase.js";

    const NOUVELLES_ORGANISATIONS = [
      { slug: "ezy", nom: "Amicale des Sapeurs-Pompiers d'Ézy-sur-Eure", couleur: "#16A34A", logoBase64: null, actif: true },
      { slug: "saint-andre", nom: "Amicale des Sapeurs-Pompiers de Saint-André-de-l'Eure", couleur: "#EA580C", logoBase64: null, actif: true }
    ];

    const log = (msg) => {
      document.getElementById("log").textContent += msg + "\n";
      console.log(msg);
    };

    document.getElementById("btn-login").onclick = () =>
      loginGoogle().catch(e => log("❌ Erreur connexion : " + e.message));

    onAuth(async (user) => {
      if (!user) { log("Non connecté."); return; }
      const admin = await isAdmin(user.email);
      log(`Connecté : ${user.email} — admin : ${admin}`);
      document.getElementById("btn-seed").disabled = !admin;
    });

    document.getElementById("btn-seed").onclick = async () => {
      for (const org of NOUVELLES_ORGANISATIONS) {
        try {
          await creerOrganisation(org);
          const relu = await obtenirOrganisation(org.slug);
          log(`✅ organisations/${org.slug} créé : ${JSON.stringify(relu)}`);
        } catch (e) {
          log(`❌ Erreur sur ${org.slug} : ` + e.message);
        }
      }
    };
  </script>
</body>
</html>
