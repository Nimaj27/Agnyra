name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Générer le monofichier
        run: python3 build.py

      - name: Vérifier que index-monofichier.html est à jour
        run: |
          if ! git diff --quiet -- index-monofichier.html; then
            echo "::error::index-monofichier.html n'est pas à jour."
            echo "Lance 'python3 build.py' après toute modification de css/style.css ou des modules js/*.js, puis committe le résultat."
            git diff --stat -- index-monofichier.html
            exit 1
          fi

      - name: Vérifier la syntaxe des modules JS
        run: |
          for f in js/*.js; do
            node --check "$f"
          done
